baseURL = "https://shchoice.github.io/claude-code-cookbook"
title = "Claude Code CookBook"
theme = "github.com/imfing/hextra"

enableRobotsTXT = true
enableGitInfo = true

ignoreLogs = ['warning-goldmark-raw-html']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

defaultContentLanguage = "ko"

[[menus.main]]
  name = "문서"
  pageRef = "/docs"
  weight = 1

[[menus.main]]
  name = "블로그"
  pageRef = "/blog"
  weight = 2

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = true
  [params.footer]
    enable = true
  [params.editURL]
    enable = true
    base = "https://github.com/shchoice/claude-code-cookbook/edit/main/content"
