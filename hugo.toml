baseURL = "https://shchoice.github.io/claude-code-cookbook"
title = "Claude Code CookBook"
theme = "github.com/imfing/hextra"

enableRobotsTXT = true
enableGitInfo = true

ignoreLogs = ['warning-goldmark-raw-html']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

defaultContentLanguage = "ko"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menus.main]]
  name = "문서"
  pageRef = "/docs"
  weight = 1

[[menus.main]]
  name = "블로그"
  url = "https://shchoice.github.io/"
  weight = 2
  [menus.main.params]
    external = true

[[menus.main]]
  name = "검색"
  weight = 5
  [menus.main.params]
    type = "search"

[[menus.main]]
  name = "테마 전환"
  weight = 10
  [menus.main.params]
    type = "theme-toggle"

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

dateFormat = "2006-01-02"

[frontmatter]
  date = ["date", ":git", ":fileModTime", ":default"]
  lastmod = [":git", "lastmod", "date", ":fileModTime", ":default"]

[params]
  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/logo.svg"
      dark = "images/logo.svg"
      width = "24"
      height = "24"
  [params.footer]
    enable = true
  [params.editURL]
    enable = true
    base = "https://github.com/shchoice/claude-code-cookbook/edit/main/content"
