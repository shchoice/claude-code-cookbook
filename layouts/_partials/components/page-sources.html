{{- with .Params.sources -}}
<style>
  .page-sources-card {
    border-radius:0.75rem;
    border:1px solid #e5e7eb;
    background:linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
    padding:1.25rem 1.5rem;
  }
  .page-sources-label {
    font-size:0.8rem;
    font-weight:600;
    color:#374151;
    letter-spacing:0.05em;
    text-transform:uppercase;
  }
  .page-sources-icon-header { stroke:#6b7280; }
  .page-sources-link {
    display:flex;
    align-items:center;
    gap:0.625rem;
    padding:0.625rem 0.875rem;
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:0.5rem;
    color:#111827;
    font-size:0.875rem;
    text-decoration:none;
    transition:all 0.15s ease;
  }
  .page-sources-link:hover {
    border-color:#3b82f6;
    box-shadow:0 1px 3px rgba(59,130,246,0.12);
  }
  .page-sources-link-icon { stroke:#3b82f6; }

  :root.dark .page-sources-card {
    border-color:#374151;
    background:linear-gradient(135deg, #1f2937 0%, #111827 100%);
  }
  :root.dark .page-sources-label { color:#d1d5db; }
  :root.dark .page-sources-icon-header { stroke:#9ca3af; }
  :root.dark .page-sources-link {
    background:#1f2937;
    border-color:#374151;
    color:#f3f4f6;
  }
  :root.dark .page-sources-link:hover {
    border-color:#60a5fa;
    box-shadow:0 1px 3px rgba(96,165,250,0.2);
  }
  :root.dark .page-sources-link-icon { stroke:#60a5fa; }
</style>
<div style="margin-top:3rem;">
  <div class="page-sources-card">
    <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">
      <svg class="page-sources-icon-header" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/>
      </svg>
      <span class="page-sources-label">참고 자료</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:0.5rem;">
      {{- range . -}}
      <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="page-sources-link">
        <svg class="page-sources-link-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
        <span>{{ .title }}</span>
      </a>
      {{- end -}}
    </div>
  </div>
</div>
{{- end -}}
